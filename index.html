
<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- LEFT CONTROLLER -->
      <a-entity meta-touch-controls="hand: left"></a-entity>

      <!-- RIGHT CONTROLLER -->
   
  <a-entity
  id="rightController"
  meta-touch-controls="hand: right"
  raycaster="objects: .pickup; far: 3; showLine: true; lineColor: #FFFF00">
</a-entity>
      

      <!-- CAMERA AND DIAGNOSTIC -->
      <a-entity camera look-controls position="0 1.6 0">
        <a-text
          id="status"
          value="Checking controllers..."
          position="-0.7 0.3 -1.5"
          color="black"
          width="2">
        </a-text>
      </a-entity>

      <!-- OBJECTS -->
      <a-box position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9">
      </a-box>
<a-box
  id="pickupCubeBlue"
  class="pickup"
  position="0 1.2 -2"
  width="0.2"
  height="0.2"
  depth="0.2"
  color="#0088FF">
</a-box>
      
  <a-box
  id="pickupCubeRed"
  class="pickup"
  position="5 1.2 0"
  width="0.2"
  height="0.2"
  depth="0.2"
  color="#f11c1c">
</a-box>
    
      <a-plane position="0 0 -4"
        rotation="-90 0 0"
        width="500"
        height="500"
        color="#7BC8A4">
      </a-plane>
      
      <a-plane position="0 0.2 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#6167ce">
      </a-plane>

      <a-sky color="#ECECEC"></a-sky>

    </a-scene>

    <script>
     
const status = document.querySelector('#status');

let leftConnected = false;
let rightConnected = false;

function updateStatus() {
  status.setAttribute(
    'value',
    'Left controller: ' + (leftConnected ? 'CONNECTED' : 'WAITING') +
    '\nRight controller: ' + (rightConnected ? 'CONNECTED' : 'WAITING')
  );
}

const leftController = document.querySelector(
  '[meta-touch-controls="hand: left"]'
);

const rightController = document.querySelector(
  '[meta-touch-controls="hand: right"]'
);

leftController.addEventListener('controllerconnected', () => {
  leftConnected = true;
  updateStatus();
});

rightController.addEventListener('controllerconnected', () => {
  rightConnected = true;
  updateStatus();
});

leftController.addEventListener('controllerdisconnected', () => {
  leftConnected = false;
  updateStatus();
});

rightController.addEventListener('controllerdisconnected', () => {
  rightConnected = false;
  updateStatus();
});

updateStatus();

    </script>


<script>
  const pickupController =
    document.querySelector('#rightController');

  const scene =
    document.querySelector('a-scene');

  let heldObject = null;

  // MAIN TRIGGER PRESSED
  pickupController.addEventListener('triggerdown', () => {

    if (heldObject) return;

    const raycaster =
      pickupController.components.raycaster;

    if (!raycaster) return;

    const hits = raycaster.intersectedEls;

    if (!hits.length) return;

    const object = hits[0];

    if (!object.classList.contains('pickup')) return;

    heldObject = object;

    // Attach cube to the controller
    pickupController.object3D.attach(
      heldObject.object3D
    );

    // Position cube in front of controller
    heldObject.object3D.position.set(0, 0, -0.25);

  });

  // MAIN TRIGGER RELEASED
  pickupController.addEventListener('triggerup', () => {

    if (!heldObject) return;

    // Drop cube into the world
    scene.object3D.attach(
      heldObject.object3D
    );

    heldObject = null;

  });

</script>


  </body>
</html>
