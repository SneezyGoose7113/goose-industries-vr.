
<!DOCTYPE html>
<html>
<head>
  <title>GOOSE Industries VR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- RIGHT THUMBSTICK MOVEMENT -->
  <script>
    AFRAME.registerComponent('right-thumbstick-move', {
      schema: {
        target: { type: 'selector' },
        camera: { type: 'selector' },
        speed: { default: 2 }
      },

      init: function () {
        this.axisX = 0;
        this.axisY = 0;

        this.el.addEventListener('thumbstickmoved', (event) => {
          this.axisX = event.detail.x;
          this.axisY = event.detail.y;
        });
      },

      tick: function (time, delta) {
        if (!this.data.target || !this.data.camera) return;

        if (
          Math.abs(this.axisX) < 0.08 &&
          Math.abs(this.axisY) < 0.08
        ) return;

        const camera = this.data.camera.object3D;
        const rig = this.data.target.object3D;

        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3()
          .crossVectors(
            forward,
            new THREE.Vector3(0, 1, 0)
          )
          .normalize();

        const movement = forward
          .multiplyScalar(-this.axisY)
          .add(right.multiplyScalar(this.axisX));

        if (movement.length() > 1) {
          movement.normalize();
        }

        rig.position.addScaledVector(
          movement,
          this.data.speed * delta / 1000
        );
      }
    });
  </script>
</head>

<body>

  <a-scene>

    <!-- PLAYER RIG -->
    <a-entity id="playerRig">

      <!-- LEFT CONTROLLER -->
      <a-entity
        meta-touch-controls="hand: left">
      </a-entity>

      <!-- RIGHT CONTROLLER -->
      <!-- RIGHT CONTROLLER -->
<a-entity
  id="rightController"
  meta-touch-controls="hand: right">

  <!-- DOWNWARD-ANGLED GRABBING LASER -->
  <a-entity
    id="grabRay"
    rotation="-20 0 0"
    raycaster="objects: .pickup; far: 3; showLine: true; lineColor: #FFFF00">
  </a-entity>

</a-entity>

      <!-- CAMERA AND DIAGNOSTIC -->
      <a-entity
        id="playerCamera"
        camera
        look-controls
        position="0 1.6 0">

        <a-text
          id="status"
          value="Checking controllers..."
          position="-0.7 0.3 -1.5"
          color="black"
          width="2">
        </a-text>

      </a-entity>

    </a-entity>


    <!-- WORLD OBJECTS -->

    <!-- CYAN BLOCK -->
    <a-box
      position="-1 0.5 -3"
      rotation="0 45 0"
      color="#4CC3D9">
    </a-box>

    <!-- BLUE PICKUP CUBE -->
    <a-box
      id="pickupCubeBlue"
      class="pickup"
      position="0 1.2 -2"
      width="0.2"
      height="0.2"
      depth="0.2"
      color="#0088FF">
    </a-box>

    <!-- RED PICKUP CUBE -->
    <a-box
      id="pickupCubeRed"
      class="pickup"
      position="2 1.2 -2"
      width="0.2"
      height="0.2"
      depth="0.2"
      color="#f11c1c">
    </a-box>

    <!-- LARGE GREEN FLOOR -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="500"
      height="500"
      color="#7BC8A4">
    </a-plane>

    <!-- BLUE PLATFORM -->
    <a-plane
      position="0 0.2 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#6167ce">
    </a-plane>

    <!-- SKY -->
    <a-sky color="#ECECEC"></a-sky>

  </a-scene>


  <!-- CONTROLLER DIAGNOSTIC SCRIPT -->
  <script>
    const status = document.querySelector('#status');

    let leftConnected = false;
    let rightConnected = false;

    function updateStatus() {
      status.setAttribute(
        'value',
        'Left controller: ' +
        (leftConnected ? 'CONNECTED' : 'WAITING') +
        '\nRight controller: ' +
        (rightConnected ? 'CONNECTED' : 'WAITING')
      );
    }

    const leftController = document.querySelector(
      '[meta-touch-controls="hand: left"]'
    );

    const rightController = document.querySelector(
      '[meta-touch-controls="hand: right"]'
    );

    leftController.addEventListener('controllerconnected', () => {
      leftConnected = true;
      updateStatus();
    });

    rightController.addEventListener('controllerconnected', () => {
      rightConnected = true;
      updateStatus();
    });

    leftController.addEventListener('controllerdisconnected', () => {
      leftConnected = false;
      updateStatus();
    });

    rightController.addEventListener('controllerdisconnected', () => {
      rightConnected = false;
      updateStatus();
    });

    updateStatus();
  </script>


  <!-- OBJECT PICKUP SCRIPT -->
  <script>
  const pickupController =
    document.querySelector('#rightController');

  const grabRay =
    document.querySelector('#grabRay');

  const scene =
    document.querySelector('a-scene');

  let heldObject = null;

  // MAIN TRIGGER PRESSED
  pickupController.addEventListener('triggerdown', () => {

    if (heldObject) return;

    const raycaster = grabRay.components.raycaster;

    if (!raycaster) return;

    const hits = raycaster.intersectedEls;

    if (!hits.length) return;

    const object = hits[0];

    if (!object.classList.contains('pickup')) return;

    heldObject = object;

    pickupController.object3D.attach(
      heldObject.object3D
    );

    heldObject.object3D.position.set(
      0, 0, -0.25
    );
  });

  // MAIN TRIGGER RELEASED
  pickupController.addEventListener('triggerup', () => {

    if (!heldObject) return;

    scene.object3D.attach(
      heldObject.object3D
    );

    heldObject = null;
  });
</script>

</body>
</html>
