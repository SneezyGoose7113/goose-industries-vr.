
<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- LEFT CONTROLLER -->
      <a-entity meta-touch-controls="hand: left"></a-entity>

      <!-- RIGHT CONTROLLER -->
      <a-entity meta-touch-controls="hand: right"></a-entity>

      <!-- CAMERA AND DIAGNOSTIC -->
      <a-entity camera look-controls position="0 1.6 0">
        <a-text
          id="status"
          value="Checking controllers..."
          position="-0.7 0.3 -1.5"
          color="black"
          width="2">
        </a-text>
      </a-entity>

      <!-- OBJECTS -->
      <a-box position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9">
      </a-box>

      <a-plane position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4">
      </a-plane>

      <a-sky color="#ECECEC"></a-sky>

    </a-scene>

    <script>
      const status = document.querySelector('#status');

      function checkControllers() {
        const gamepads = navigator.getGamepads();
        let found = 0;

        for (const gamepad of gamepads) {
          if (gamepad && gamepad.connected) {
            found++;
          }
        }

        status.setAttribute(
          'value',
          'Connected controllers: ' + found
        );
      }

      setTimeout(() => {
  checkControllers();

  setInterval(checkControllers, 1000);
}, 10000);
    </script>

  </body>
</html>
