
<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      
      <a-entity 
        meta-touch-controls="hand: left"
        position="0 0 0">
      </a-entity>

      <a-entity 
        meta-touch-controls="hand: right"
        position="0 0 0">
      </a-entity>

      <a-text
        id="status"
        value="Waiting for controllers..."
        position="-2 2 -3"
        color="black"
        width="4">
      </a-text>

      <a-box position="-1 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9">
      </a-box>

      <a-plane position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4">
      </a-plane>

      <a-sky color="#ECECEC"></a-sky>

    </a-scene>

    <script>
      const status = document.querySelector('#status');

      function checkControllers() {
        const gamepads = navigator.getGamepads();

        let found = 0;

        for (const gamepad of gamepads) {
          if (gamepad && gamepad.connected) {
            found++;

            console.log(
              "Controller detected:",
              gamepad.id
            );
          }
        }

        status.setAttribute(
          'value',
          'Connected controllers: ' + found
        );
      }

      setInterval(checkControllers, 1000);
    </script>
  </body>
</html>
